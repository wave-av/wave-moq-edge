# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit base configuration (generic). Harvested from an internal WAVE monorepo with all
# WAVE-specific custom_checks/path_instructions/refs stripped. Consumers add their own
# path_instructions + custom_checks on top. Docs: https://docs.coderabbit.ai
language: en-US

reviews:
  auto_review:
    enabled: true
    base_branches:
      - main
      - master
      - develop
      - "release/*"
      - "hotfix/*"
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "[DRAFT]"
      - "[SKIP CI]"
    drafts: false
    # #55 credit-burn fix: stop re-review-on-every-push (the confirmed fleet-wide
    # burn driver, amplified by many ephemeral agent-worktree PRs). One full review
    # per PR is kept; pushing more commits does not re-trigger it automatically.
    # `@coderabbitai review` still works on demand for real PRs that need a re-look.
    auto_incremental_review: false
    auto_pause_after_reviewed_commits: 1
    # Opt-out for throwaway/ephemeral PRs only: apply the `skip-review` label to skip
    # (negative match; PRs without it are unaffected — real PRs keep full coverage).
    labels:
      - "!skip-review"

  # ── auto_approve was REMOVED (inert) ──────────────────────────────────────
  # `auto_approve` is not a key in CodeRabbit's live v2 schema
  # (storage.googleapis.com/coderabbit_public_assets/schema.v2.json, re-verified 2026-08-06),
  # so the block that used to sit here never did anything. The comment it carried was worse
  # than the block: it claimed the auto-approval "satisfies branch protection's required
  # review", which was never true — nothing in this file has ever posted a review. Removing
  # it changes no behaviour. CodeRabbit's unearned approvals are vendor-side and no key here
  # disables them; use branch protection requiring a human/CODEOWNERS review instead. (#1083)

  review_status: true
  request_changes_workflow: false
  profile: chill
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  poem: false
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true

  path_filters:
    - "!**/*.lock"
    - "!**/generated/**"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/out/**"
    - "!**/coverage/**"
    - "!**/__snapshots__/**"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.svg"
    - "!**/*.woff2"
    - "!**/*.mp4"

  labeling_instructions:
    - label: "security"
      instructions: "Apply when changes affect authentication, authorization, secrets, or security headers."
    - label: "breaking-change"
      instructions: "Apply when changes break backward compatibility or require client updates."
    - label: "size/M"
      instructions: "Apply when PR has 50-200 lines changed."
    - label: "size/L"
      instructions: "Apply when PR has 200-500 lines changed."
    - label: "size/XL"
      instructions: "Apply when PR has >500 lines changed."

  # Open-source analyzers CodeRabbit runs as part of review.
  tools:
    gitleaks:
      enabled: true
    semgrep:
      enabled: true
    # The schema key is `osvScanner`, camelCase. This read `osv-scanner` since the file was
    # written; `tools` allows additional properties, so CodeRabbit accepted the misspelling
    # silently and ran no OSV scanning at all. Verified against the live v2 schema
    # (storage.googleapis.com/coderabbit_public_assets/schema.v2.json, 2026-08-06): the 57 tool
    # keys include `osvScanner` and do not include `osv-scanner`. (#1083)
    osvScanner:
      enabled: true
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    actionlint:
      enabled: true
    ruff:
      enabled: true
    ast-grep:
      enabled: true
      packages:
        - "ast-grep-essentials"
    # Same silent-drop class as osvScanner above: the schema key is `github-checks`,
    # hyphenated. This read `github_checks` (underscore), so the 900s timeout override
    # was inert. Verified against the same live v2 schema fetch (2026-08-06).
    github-checks:
      enabled: true
      timeout_ms: 900000

knowledge_base:
  code_guidelines:
    enabled: true
  learnings:
    scope: auto
