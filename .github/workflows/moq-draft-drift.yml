name: MoQ draft drift

on:
  pull_request:
    paths:
      - "wrangler.toml"
      - "**/*.ts"
      - "**/*.md"
      - "package.json"
      - "scripts/check-moq-draft-version.sh"
      - ".github/workflows/moq-draft-drift.yml"
  push:
    branches: [main]
  schedule:
    # Weekly drift check — alerts if IETF advances past our pinned current
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: Check MoQ Transport draft version drift
    runs-on: ubuntu-latest
    steps:
      # This repo is the source of scripts/check-moq-draft-version.sh, so the script is vendored and
      # nothing is fetched at run time. The org template (wave-av/.github) pins and SHA-256-verifies
      # its fallback fetch for repos that do not carry the script.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Run drift check
        run: bash scripts/check-moq-draft-version.sh --ci
