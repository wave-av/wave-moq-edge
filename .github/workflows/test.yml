name: test (typecheck + vitest)

# Typechecks the Worker and runs the hermetic MoQ wire-codec + relay unit tests
# (__tests__/moq-wire.test.ts, __tests__/moq-relay.test.ts). These are pure, network-free tests of
# the draft-ietf-moq-transport-18 serialization + the publish/subscribe fan-out state machine, so
# they gate every change to the protocol code without needing any CF runtime. No untrusted input is
# interpolated into any run: step.

on:
  push:
    branches: [main, master, staging]
    paths:
      - "src/**"
      - "*.ts"
      - "__tests__/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src/**"
      - "*.ts"
      - "__tests__/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/test.yml"
  workflow_dispatch:

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read  # required to pull @wave-av/spoke-chassis from GitHub Packages

jobs:
  test:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit # npm registry only
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@wave-av"

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (hermetic — wire codec + relay)
        # --coverage writes ./coverage/lcov.info via the v8 provider (see vitest.config.ts).
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        # CODECOV_TOKEN is a REPO-level Actions secret holding this repo's Codecov *upload* token.
        # Codecov has two distinct credentials and they are not interchangeable: the org API/read
        # token authenticates api.codecov.io, while only the per-repo upload token is accepted here.
        # Least privilege: a leak of this value lets someone post coverage to this one repo.
        #
        # Referenced at STEP level, never in a workflow-level `env:` — that would hand the value to
        # every step in the job, including third-party actions.
        #
        # fail_ci_if_error: true is deliberate. The previous fleet-wide attempt at Codecov used
        # `false` everywhere, which turned every rejected upload into a silent no-op — the direct
        # cause of nothing ever being ingested across 135 repos. Loud beats invisible.
        #
        # if: always() so coverage still uploads when a test fails — a failing PR is exactly when
        # the coverage delta is most worth seeing.
        #
        # NOTE: harden-runner above runs `egress-policy: audit`, which permits (and logs) the
        # egress to codecov.io. If that is ever tightened to `block`, codecov.io and its storage
        # endpoint must be added to the allowed-endpoints list or this step will fail.
        #
        # This repo is PUBLIC, so the `if` also skips fork PRs. GitHub withholds secrets from a
        # fork's workflow run, which would leave `token` empty and — because fail_ci_if_error is
        # true — fail every external contributor's PR on a step they cannot possibly satisfy.
        # Skipping is correct rather than merely quieter: the fork has nothing to upload with.
        # Coverage for the merge commit is still recorded by the push-to-main run.
        # (These are `if:` expressions, evaluated by the Actions expression engine and never
        # interpolated into a shell — so this is not the `run:`-injection footgun.)
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: worker
          name: wave-moq-edge-worker
          disable_search: true
          fail_ci_if_error: true
