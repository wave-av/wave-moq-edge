name: deploy

# Env-aware auto-deploy for the spoke chassis. Inherits the proven wave-dispatch / API gateway
# pattern with one addition: staging vs production split by branch.
#
#   push to main             → wrangler deploy --env production  (<proto>.wave.online)
#   push to branch staging   → wrangler deploy --env staging     (<proto>.staging.wave.online)
#
# Every spoke spawned from this chassis inherits this workflow for free. Two repo secrets are
# required to actually deploy: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID + the spoke's own product-specific secrets
# set via `wrangler secret put` (see wrangler.toml SECRETS block). When CLOUDFLARE_API_TOKEN is
# absent the workflow no-ops with a notice (idempotent-resilient pattern).

on:
  push:
    branches: [main, master, staging]
    paths:
      # This worker's entry + modules live at the repo ROOT (wrangler.toml `main = "index.ts"`),
      # not under src/. `*.ts` catches index.ts and every root module (dedup-index, recording-writer,
      # single-instance-writer, streaming-hasher, …) so a router/module change actually auto-deploys.
      # Without this, edits to the router silently no-op the deploy (P2.6 had to `gh workflow run` by hand).
      - "*.ts"
      - "src/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      env:
        description: "Deploy environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-wave-moq-edge
  cancel-in-progress: false

permissions:
  contents: read
  packages: read  # required to pull @wave-av/spoke-chassis from GitHub Packages

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false
          registry-url: "https://npm.pkg.github.com"
          scope: "@wave-av"
      - name: install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Derive deploy target from the trigger. `github.ref_name` is the branch (push) or input env
      # (workflow_dispatch). For push triggers we map branch → env; for workflow_dispatch the input
      # IS the env. Either way, GITHUB_OUTPUT only carries one of two literal strings ("staging" or
      # "production") — no untrusted shell expansion. Validated by the case expression.
      - name: resolve target env
        id: target
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENV: ${{ github.event.inputs.env }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch)
              case "$INPUT_ENV" in
                staging|production) ENV_NAME="$INPUT_ENV" ;;
                *) echo "::error::workflow_dispatch input env must be staging or production"; exit 1 ;;
              esac
              ;;
            push)
              case "$REF_NAME" in
                main|master) ENV_NAME="production" ;;
                staging)     ENV_NAME="staging" ;;
                *) echo "::error::push from unexpected branch $REF_NAME"; exit 1 ;;
              esac
              ;;
            *) echo "::error::unsupported trigger $EVENT_NAME"; exit 1 ;;
          esac
          echo "env=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "Deploying to: $ENV_NAME"
      # Belt-and-suspenders against a stale/orphaned run: even with `concurrency` queueing
      # runs in trigger order, this refuses to deploy a commit that is no longer (or never was)
      # reachable from the tip of the branch that triggered this run. fetch-depth: 0 above gives
      # this full history.
      - name: deploy guard — commit must be reachable from current branch tip
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          git fetch origin "$REF_NAME" --quiet
          TIP=$(git rev-parse "origin/$REF_NAME")
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$REF_NAME"; then
            echo "::error::commit $GITHUB_SHA is not an ancestor of origin/$REF_NAME (tip $TIP) — a newer commit has superseded this run; refusing to deploy a stale/orphaned commit"
            exit 1
          fi
          echo "deploy guard OK: $GITHUB_SHA is an ancestor of origin/$REF_NAME (tip $TIP)"


      - name: token gate
        id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN unset — skipping CD"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: deploy worker
        if: steps.gate.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0  # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # account_id was removed from the public wrangler.toml; wrangler reads it
          # from this secret at deploy time (CLOUDFLARE_ACCOUNT_ID) instead.
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env ${{ steps.target.outputs.env }} --var GIT_SHA:${{ github.sha }}

      # Proven-live gate (proven-live-or-not-done): a green `wrangler deploy` only proves the API
      # call succeeded, not that the right bundle is answering live traffic. This step is the
      # receipt. Skips (notices, does not fail) when the resolved env has no live route configured
      # in wrangler.toml.
      - name: post-deploy verify — proven live, not merely deployed
        if: steps.gate.outputs.deploy == 'true'
        env:
          TARGET_ENV: ${{ steps.target.outputs.env }}
          EXPECT_SHA: ${{ github.sha }}
        run: |
          set -e
          HOST=$(node scripts/ci/resolve-deploy-host.mjs "$TARGET_ENV" || true)
          if [ -z "$HOST" ]; then
            echo "::notice::no route configured for env '$TARGET_ENV' in wrangler.toml — skipping live verification"
            exit 0
          fi

          echo "Verifying https://$HOST/health reports sha == $EXPECT_SHA (timeout 120s)..."
          DEADLINE=$((SECONDS + 120))
          LIVE_SHA=""
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            LIVE_SHA=$(curl -fsS --max-time 10 "https://$HOST/health" 2>/dev/null \
              | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{process.stdout.write(JSON.parse(d).sha||"")}catch{process.stdout.write("")}})' \
              || echo "")
            if [ "$LIVE_SHA" = "$EXPECT_SHA" ]; then
              echo "receipt: https://$HOST/health sha=$LIVE_SHA matches $EXPECT_SHA"
              break
            fi
            sleep 5
          done
          if [ "$LIVE_SHA" != "$EXPECT_SHA" ]; then
            echo "::error::post-deploy verification FAILED after 120s — https://$HOST/health reports sha='$LIVE_SHA', expected '$EXPECT_SHA'. A stale or wrong bundle may be live."
            exit 1
          fi
