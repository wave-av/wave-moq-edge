name: deploy

# Env-aware auto-deploy for the spoke chassis. Inherits the proven wave-dispatch / API gateway
# pattern with one addition: staging vs production split by branch.
#
#   push to main             → wrangler deploy --env production  (<proto>.wave.online)
#   push to branch staging   → wrangler deploy --env staging     (<proto>.staging.wave.online)
#
# Every spoke spawned from this chassis inherits this workflow for free. Two repo secrets are
# required to actually deploy: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID + the spoke's own product-specific secrets
# set via `wrangler secret put` (see wrangler.toml SECRETS block). When CLOUDFLARE_API_TOKEN is
# absent the workflow no-ops with a notice (idempotent-resilient pattern).
#
# REL-003 (GA gate: "releases are progressive, reversible, and automatically stopped on
# regression"): the `deploy` job below is gated on a real `environment:` — GitHub environment
# protection rules (required reviewers, deployment branch policies) attach to that name in repo
# settings. This workflow now resolves the environment in its OWN job (`resolve-target`) BEFORE
# the gated job runs, because `environment:` cannot read a same-job step output — it can only read
# `needs.<job>.outputs.*`. That split is what makes the approval gate real instead of decorative.
#
# ROLLBACK-BY-DISPATCH: `gh workflow run` accepts a branch/tag `--ref`, never a commit SHA (the
# GitHub REST API rejects a SHA as workflow_dispatch ref). To let gam-post-deploy-guard.yml (or an
# operator) roll back to an exact PRIOR commit while still dispatching on a valid branch ref, this
# workflow accepts an optional `sha` input: dispatch stays on `--ref main`, and `sha` names the
# exact commit to check out, deploy, and verify. Omitted (the common case) it defaults to the
# dispatched ref's own tip.

on:
  push:
    branches: [main, master, staging]
    paths:
      # This worker's entry + modules live at the repo ROOT (wrangler.toml `main = "index.ts"`),
      # not under src/. `*.ts` catches index.ts and every root module (dedup-index, recording-writer,
      # single-instance-writer, streaming-hasher, …) so a router/module change actually auto-deploys.
      # Without this, edits to the router silently no-op the deploy (P2.6 had to `gh workflow run` by hand).
      - "*.ts"
      - "src/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      env:
        description: "Deploy environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      sha:
        description: "Exact commit SHA to deploy (rollback use — leave empty to deploy the dispatched ref's tip)"
        required: false
        default: ""

concurrency:
  group: deploy-wave-moq-edge
  cancel-in-progress: false

permissions:
  contents: read
  packages: read  # required to pull @wave-av/spoke-chassis from GitHub Packages

jobs:
  # Ungated on purpose: this job only computes WHICH environment/commit the deploy job below will
  # target. It touches no secrets, deploys nothing, and must run before the `environment:` gate can
  # be evaluated (environment: can only read needs.*.outputs, never a step output from its own job).
  resolve-target:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.target.outputs.env }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      # Derive deploy target from the trigger. `github.ref_name` is the branch (push) or the
      # dispatched ref (workflow_dispatch). For push triggers we map branch → env; for
      # workflow_dispatch the `env` input IS the env, and an optional `sha` input pins the exact
      # commit to deploy (rollback use — see header). GITHUB_OUTPUT only ever carries a validated
      # literal env name plus a hex commit SHA — no untrusted shell expansion.
      - name: resolve target env + sha
        id: target
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENV: ${{ github.event.inputs.env }}
          INPUT_SHA: ${{ github.event.inputs.sha }}
          TIP_SHA: ${{ github.sha }}
        run: |
          set -e
          case "$EVENT_NAME" in
            workflow_dispatch)
              case "$INPUT_ENV" in
                staging|production) ENV_NAME="$INPUT_ENV" ;;
                *) echo "::error::workflow_dispatch input env must be staging or production"; exit 1 ;;
              esac
              # REL-003 fix: workflow_dispatch lets `env` and the dispatched-from branch be
              # chosen INDEPENDENTLY — github.ref_name is whatever branch the operator picked in
              # the "Run workflow" dropdown, not necessarily main. Without this check, any
              # collaborator with repo write access could push unreviewed code to a throwaway
              # branch, dispatch this workflow from that branch with env=production, and reach
              # production with no review and no branch restriction enforced anywhere in code
              # (the `environment: production` gate is a no-op until a repo admin separately
              # configures GitHub Environment protection — see the `deploy:` job comment). Mirror
              # the SAME restriction the `push` trigger already enforces below: production only
              # ships from main or master. This runs first, before checkout/secrets/deploy.
              if [ "$ENV_NAME" = "production" ]; then
                case "$REF_NAME" in
                  main|master) ;;
                  *)
                    echo "::error::workflow_dispatch env=production must be dispatched from main or master, not '$REF_NAME' — dispatching production from an arbitrary/throwaway branch bypasses review. Merge to main first, or use env=staging to test from a branch."
                    exit 1
                    ;;
                esac
              fi
              if [ -n "$INPUT_SHA" ]; then
                if ! printf '%s' "$INPUT_SHA" | grep -qE '^[0-9a-f]{7,40}$'; then
                  echo "::error::workflow_dispatch input sha '$INPUT_SHA' is not a lowercase hex commit SHA"
                  exit 1
                fi
                SHA="$INPUT_SHA"
              else
                SHA="$TIP_SHA"
              fi
              ;;
            push)
              case "$REF_NAME" in
                main|master) ENV_NAME="production" ;;
                staging)     ENV_NAME="staging" ;;
                *) echo "::error::push from unexpected branch $REF_NAME"; exit 1 ;;
              esac
              SHA="$TIP_SHA"
              ;;
            *) echo "::error::unsupported trigger $EVENT_NAME"; exit 1 ;;
          esac
          echo "env=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying to: $ENV_NAME @ $SHA"

  deploy:
    needs: resolve-target
    runs-on: ubuntu-latest
    # REL-003 approval gate: this name is what a repo admin attaches required-reviewer /
    # deployment-branch-policy protection rules to (Settings → Environments). Until an operator
    # configures protection on "production" this is a no-op passthrough — wiring the name is the
    # code-side half of the fix; the protection rule itself is a repo-settings action outside this
    # PR's authority.
    environment: ${{ needs.resolve-target.outputs.env }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-target.outputs.sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false
          registry-url: "https://npm.pkg.github.com"
          scope: "@wave-av"
      - name: install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Belt-and-suspenders against a stale/orphaned run: even with `concurrency` queueing
      # runs in trigger order, this refuses to deploy a commit that is no longer (or never was)
      # reachable from the tip of the branch that triggered this run. fetch-depth: 0 above gives
      # this full history. Checks the RESOLVED sha (which for a rollback dispatch is an OLDER
      # commit than the dispatched ref's tip, but still must be an ancestor of it).
      - name: deploy guard — commit must be reachable from current branch tip
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET_ENV: ${{ needs.resolve-target.outputs.env }}
          TARGET_SHA: ${{ needs.resolve-target.outputs.sha }}
        run: |
          set -e
          # REL-003 fix: for a PRODUCTION deploy, ancestry MUST be checked against the canonical
          # production branch (main, falling back to master) — never against github.ref_name.
          # ref_name is whatever branch a workflow_dispatch was run from; checking a throwaway
          # branch's tip against ITSELF is a tautology that always passes, which is exactly what
          # let an arbitrary unreviewed branch reach production (paired with the resolve-target
          # fix above, which now refuses to even resolve env=production for a non-main/master
          # ref_name — this step is the second, independent layer so the guard holds even if that
          # earlier check is ever loosened). Push triggers already only fire from main/master, so
          # this changes behavior only for the workflow_dispatch path.
          git fetch origin --quiet
          if [ "$TARGET_ENV" = "production" ]; then
            if git show-ref --verify --quiet refs/remotes/origin/main; then
              BASE_REF="main"
            elif git show-ref --verify --quiet refs/remotes/origin/master; then
              BASE_REF="master"
            else
              echo "::error::env is production but neither origin/main nor origin/master exists — cannot verify commit ancestry, refusing to deploy"
              exit 1
            fi
          else
            BASE_REF="$REF_NAME"
          fi
          TIP=$(git rev-parse "origin/$BASE_REF")
          if ! git merge-base --is-ancestor "$TARGET_SHA" "origin/$BASE_REF"; then
            echo "::error::commit $TARGET_SHA is not an ancestor of origin/$BASE_REF (tip $TIP) — a newer commit has superseded this run, the rollback sha input is wrong, or (production) the dispatched branch was not $BASE_REF; refusing to deploy a stale/orphaned/unreachable/unreviewed commit"
            exit 1
          fi
          echo "deploy guard OK: $TARGET_SHA is an ancestor of origin/$BASE_REF (tip $TIP)"


      - name: token gate
        id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN unset — skipping CD"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: deploy worker
        if: steps.gate.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0  # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # account_id was removed from the public wrangler.toml; wrangler reads it
          # from this secret at deploy time (CLOUDFLARE_ACCOUNT_ID) instead.
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env ${{ needs.resolve-target.outputs.env }} --var GIT_SHA:${{ needs.resolve-target.outputs.sha }}

      # Proven-live gate (proven-live-or-not-done): a green `wrangler deploy` only proves the API
      # call succeeded, not that the right bundle is answering live traffic. This step is the
      # receipt. Skips (notices, does not fail) when the resolved env has no live route configured
      # in wrangler.toml. Verifies against the RESOLVED sha (rollback-aware).
      - name: post-deploy verify — proven live, not merely deployed
        if: steps.gate.outputs.deploy == 'true'
        env:
          TARGET_ENV: ${{ needs.resolve-target.outputs.env }}
          EXPECT_SHA: ${{ needs.resolve-target.outputs.sha }}
        run: |
          set -e
          HOST=$(node scripts/ci/resolve-deploy-host.mjs "$TARGET_ENV" || true)
          if [ -z "$HOST" ]; then
            if [ "$TARGET_ENV" = "production" ]; then
              echo "::error::no route resolved for env 'production' in wrangler.toml after a live production deploy — refusing to silently skip the proven-live gate. Either the wrangler.toml route/routes block is missing or resolve-deploy-host.mjs failed to parse it (check for a new TOML shape it doesn't recognise). A production deploy with an unverifiable route is a FAILURE, not a pass."
              exit 1
            fi
            echo "::notice::no route configured for env '$TARGET_ENV' in wrangler.toml — skipping live verification"
            exit 0
          fi

          echo "Verifying https://$HOST/health reports sha == $EXPECT_SHA (timeout 120s)..."
          DEADLINE=$((SECONDS + 120))
          LIVE_SHA=""
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            LIVE_SHA=$(curl -fsS --max-time 10 "https://$HOST/health" 2>/dev/null \
              | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{process.stdout.write(JSON.parse(d).sha||"")}catch{process.stdout.write("")}})' \
              || echo "")
            if [ "$LIVE_SHA" = "$EXPECT_SHA" ]; then
              echo "receipt: https://$HOST/health sha=$LIVE_SHA matches $EXPECT_SHA"
              break
            fi
            sleep 5
          done
          if [ "$LIVE_SHA" != "$EXPECT_SHA" ]; then
            echo "::error::post-deploy verification FAILED after 120s — https://$HOST/health reports sha='$LIVE_SHA', expected '$EXPECT_SHA'. A stale or wrong bundle may be live."
            exit 1
          fi
