# pr-agent (OSS) — inline lane for this PUBLIC repo.
# Engine: OSS Qodo Merge on our OPENAI_KEY (trial-independent).
#
# WHY INLINED: wave-moq-edge is PUBLIC; wave-av/wave-foundation is PRIVATE. GitHub
# Actions does NOT permit a public caller to consume a private reusable workflow
# (same structural limit documented in foundation-gate.yml). The fleet caller that
# uses wave-foundation/.github/workflows/reusable-pr-agent.yml works only in
# private repos; here the job body is inlined so the review lane can actually run.
name: pr-agent (OSS)
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

# Separate PR vs comment runs so a non-command comment cannot cancel an in-flight
# review. pull_request events still cancel each other on synchronize.
concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  pr_agent:
    if: >-
      github.event.sender.type != 'Bot' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
      checks: write
    name: Run pr agent on every pull request, respond to user comments
    steps:
      - name: PR Agent action step
        id: pragent
        uses: qodo-ai/pr-agent@f6af7d77554ff8d26adffded077e6461329e92fa # v0.42.0
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
          pr_code_suggestions.commitable_code_suggestions: "true"
